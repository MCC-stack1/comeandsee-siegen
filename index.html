<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Come and See Siegen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Cinzel:wght@500;600;700;800;900&display=swap">
<style id="cs-style">/* Layout: Prozessionsbanner – kardinalrote Bänder mit goldenen Doppelrahmen, dazwischen helle Lesestrecken; Cinzel als Inschrift, Alegreya Sans zum Lesen */
:root {
  --red: #8F1D24;
  --red-deep: #6A1319;
  --red-night: #4A0C11;
  --red-ink: #7E1A21;
  --gold: #F2C744;
  --gold-soft: #F8E2A0;
  --gold-ink: #94650A;
  --gold-line: #D3A43B;
  --paper: #FFFDF8;
  --paper-2: #F7EFEA;
  --card: #FFFFFF;
  --ink: #2A1517;
  --muted: #6C5255;
  --line: #E9D9D3;
  --on-red: #FFFDF8;
  --on-red-2: rgba(255, 253, 248, 0.82);
  --on-red-line: rgba(242, 199, 68, 0.55);
  --qr-dark: #2B0609;
  --shadow: 0 22px 44px -26px rgba(74, 12, 17, 0.55);
  --display: "Cinzel", "Trajan Pro", "Times New Roman", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --wrap: 1180px;
  --gutter: clamp(16px, 4vw, 40px);
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #160D0E; --paper-2: #1F1415; --card: #261819; --ink: #F5ECE6; --muted: #C7AEAA;
    --line: #3F2C2E; --gold-ink: #E5B84E; --red-ink: #F3A6AA; --shadow: 0 22px 44px -26px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #160D0E; --paper-2: #1F1415; --card: #261819; --ink: #F5ECE6; --muted: #C7AEAA;
  --line: #3F2C2E; --gold-ink: #E5B84E; --red-ink: #F3A6AA; --shadow: 0 22px 44px -26px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1.125rem; line-height: 1.6; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.cs *, .cs *::before, .cs *::after, .cs-layer *, .cs-layer *::before, .cs-layer *::after { box-sizing: border-box; }
.cs img, .cs-layer img { max-width: 100%; display: block; }
:where(.cs, .cs-layer) a { color: inherit; }
.cs p { margin: 0; }
.cs h1, .cs h2, .cs h3 { margin: 0; font-family: var(--display); text-wrap: balance; }
.wrap { width: 100%; max-width: var(--wrap); margin-inline: auto; padding-inline: var(--gutter); }
section[id], header[id] { scroll-margin-top: calc(var(--nav-h) + 12px); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* type */
.eyebrow { font-family: var(--body); font-weight: 800; font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-ink); }
.on-red .eyebrow { color: var(--gold); }
.h2 { font-size: clamp(2rem, 4.2vw, 3.1rem); font-weight: 700; line-height: 1.08; letter-spacing: 0.01em; }
.lead { font-size: clamp(1.15rem, 1.6vw, 1.3rem); line-height: 1.55; }
.prose { display: grid; gap: 1em; max-width: 62ch; }
.muted { color: var(--muted); }
.rule { display: flex; align-items: center; gap: 14px; color: var(--gold-line); }
.rule::before, .rule::after { content: ""; height: 1px; flex: 1; background: currentColor; }
.rule svg { width: 14px; height: 18px; fill: currentColor; flex: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6em; padding: 0.85em 1.35em; border-radius: 3px; border: 1.5px solid transparent; font-family: var(--body); font-weight: 800; font-size: 1rem; line-height: 1.1; letter-spacing: 0.02em; text-decoration: none; cursor: pointer; transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
.btn svg { width: 1.2em; height: 1.2em; flex: none; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-gold { background: var(--gold); color: var(--red-night); box-shadow: 0 10px 24px -12px rgba(242, 199, 68, 0.75); }
.btn-gold:hover { background: #F7D466; }
.btn-ghost { background: transparent; color: var(--on-red); border-color: rgba(255, 253, 248, 0.55); }
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
.btn-red { background: var(--red); color: var(--on-red); }
.btn-red:hover { background: var(--red-deep); }
.btn-line { background: transparent; color: var(--red-ink); border-color: var(--line); }
.btn-line:hover { border-color: var(--gold-line); }
.btn-sm { padding: 0.62em 1em; font-size: 0.95rem; }
.btn[aria-disabled="true"] { opacity: 0.55; pointer-events: none; }

/* frames */
.frame { position: relative; border: 1px solid var(--gold-line); outline: 1px solid var(--gold-line); outline-offset: -8px; }

/* nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--red); color: var(--on-red); border-bottom: 1px solid var(--on-red-line); }
.nav-in { display: flex; align-items: center; gap: 20px; min-height: var(--nav-h); }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.brand svg { width: 16px; height: 22px; fill: var(--gold); }
.brand-t { font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: 0.12em; white-space: nowrap; }
.brand-s { display: block; font-family: var(--body); font-weight: 700; font-size: 0.62rem; letter-spacing: 0.3em; color: var(--gold); margin-top: 1px; }
.nav-links { display: flex; gap: 22px; }
.nav-links a { text-decoration: none; font-weight: 700; font-size: 0.98rem; color: var(--on-red-2); padding: 6px 0; border-bottom: 1.5px solid transparent; }
.nav-links a:hover { color: var(--on-red); border-bottom-color: var(--gold); }
.menu-btn { display: none; background: transparent; border: 1px solid var(--on-red-line); color: var(--on-red); width: 44px; height: 44px; border-radius: 3px; cursor: pointer; }
.menu-btn svg { width: 22px; height: 22px; }
.edit-btn { background: transparent; border: 1px dashed var(--on-red-line); color: var(--gold); border-radius: 3px; padding: 0.5em 0.8em; font: 700 0.85rem var(--body); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.edit-btn svg { width: 16px; height: 16px; }
.mobile-menu { border-top: 1px solid var(--on-red-line); background: var(--red-deep); }
.mobile-menu nav { display: grid; padding-block: 8px 16px; }
.mobile-menu a { text-decoration: none; font-weight: 700; padding: 12px 0; border-bottom: 1px solid rgba(255, 253, 248, 0.12); }
@media (max-width: 980px) {
  .nav-links { display: none; }
  .menu-btn { display: inline-grid; place-items: center; }
}
@media (max-width: 640px) { .edit-btn span { display: none; } .brand-s { display: none; } }
@media (max-width: 420px) { .nav .btn-join-label { display: none; } }

/* ribbon */
.ribbon { background: var(--red-deep); color: var(--gold-soft); border-bottom: 1px solid var(--on-red-line); overflow: hidden; }
.ribbon-track { display: flex; width: max-content; animation: ribbon 60s linear infinite; }
.ribbon-set { display: flex; align-items: center; gap: 22px; padding: 10px 11px; white-space: nowrap; font-weight: 700; font-size: 0.82rem; letter-spacing: 0.2em; text-transform: uppercase; }
.ribbon-set i { width: 5px; height: 5px; background: var(--gold); transform: rotate(45deg); flex: none; }
@keyframes ribbon { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) {
  .ribbon-track { animation: none; width: auto; flex-wrap: wrap; justify-content: center; }
  .ribbon-set + .ribbon-set { display: none; }
  .ribbon-set { flex-wrap: wrap; justify-content: center; white-space: normal; row-gap: 6px; }
}

/* hero */
.hero { position: relative; color: var(--on-red); background:
    radial-gradient(60% 70% at 72% 38%, rgba(196, 52, 60, 0.55), transparent 70%),
    radial-gradient(90% 60% at 10% 100%, rgba(74, 12, 17, 0.6), transparent 70%),
    var(--red); }
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
  background-image: repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 120px); }
.hero-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); align-items: center; padding-block: clamp(40px, 6vw, 84px) clamp(24px, 4vw, 40px); }
.hero-text { display: grid; gap: 22px; min-width: 0; }
.hero h1 { font-weight: 900; font-size: clamp(3.6rem, 8.4vw, 7.4rem); line-height: 0.92; letter-spacing: 0.01em; color: var(--gold); text-shadow: 0 3px 0 rgba(74, 12, 17, 0.35); }
.hero h1 span { display: block; }
.verse { font-family: var(--display); font-weight: 600; font-size: clamp(1rem, 1.6vw, 1.2rem); letter-spacing: 0.08em; color: var(--on-red); display: flex; flex-wrap: wrap; gap: 0.2em 0.8em; align-items: baseline; }
.verse small { font-family: var(--body); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.2em; color: var(--gold); }
.hero .lead { color: var(--on-red-2); max-width: 36ch; }
.meet { display: inline-flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border: 1px solid var(--on-red-line); background: rgba(74, 12, 17, 0.28); max-width: 100%; }
.meet svg { width: 22px; height: 22px; flex: none; color: var(--gold); margin-top: 2px; }
.meet strong { display: block; font-weight: 800; }
.meet span { color: var(--on-red-2); font-size: 0.98rem; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-art { min-width: 0; }
.hero-art .emblem { width: 100%; height: auto; max-width: 600px; display: block; margin-inline: auto; overflow: visible; }
.hero-art .glow { transform-origin: 400px 153px; animation: glow 7s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: 0.8; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .hero-art .glow { animation: none; } }
@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; text-align: left; }
  .hero-art { order: -1; }
  .hero-art .emblem { max-width: 520px; }
}

/* join card (in hero) */
.hero-join { position: relative; z-index: 3; margin-bottom: calc(-1 * var(--overlap)); }
:root { --overlap: 110px; }
@media (max-width: 760px) { :root { --overlap: 56px; } }
.joincard { background: var(--card); color: var(--ink); box-shadow: var(--shadow); padding: clamp(22px, 3vw, 34px); display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: start; gap: clamp(18px, 3vw, 36px); align-items: center; }
.jc-text { display: grid; gap: 10px; min-width: 0; padding-left: 6px; }
.jc-title { font-size: clamp(1.45rem, 2.4vw, 1.9rem); font-weight: 700; line-height: 1.15; color: var(--red-ink); }
.jc-text p { color: var(--muted); max-width: 46ch; }
.jc-steps { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 4px; font-weight: 800; font-size: 0.9rem; color: var(--ink); }
.jc-steps span { display: inline-flex; align-items: center; gap: 8px; }
.jc-steps b { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: var(--gold); font-family: var(--display); font-size: 0.8rem; }
.jc-buttons { display: none; gap: 10px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .joincard { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .joincard .qr-tile { --qr: 100%; width: 100%; max-width: 200px; justify-self: center; }
  .jc-text { grid-column: 1 / -1; padding-left: 0; }
}
@media (max-width: 640px) {
  .jc-buttons { display: flex; grid-column: 1 / -1; }
  .jc-buttons .btn { flex: 1 1 200px; }
}

/* qr tiles */
.qr-tile { display: grid; justify-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin: 0; }
.qr-box { width: var(--qr, 168px); max-width: 100%; aspect-ratio: 1; background: #fff; padding: 8px; border: 1px solid var(--gold-line); box-shadow: 0 0 0 4px var(--card), 0 0 0 5px var(--gold-line); position: relative; transition: transform 0.15s ease; }
a.qr-tile:hover .qr-box { transform: scale(1.03); }
.qr-box svg { width: 100%; height: 100%; display: block; }
.qr-box .qr-badge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 22%; aspect-ratio: 1; background: #fff; display: grid; place-items: center; border-radius: 4px; }
.qr-box .qr-badge svg { width: 70%; height: 70%; fill: var(--red); }
.qr-cap { text-align: center; display: grid; gap: 2px; }
.qr-cap strong { font-weight: 800; font-size: 1rem; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.qr-cap strong svg { width: 18px; height: 18px; color: var(--red-ink); }
.qr-cap span { font-size: 0.86rem; color: var(--muted); }
.qr-empty { width: var(--qr, 168px); max-width: 100%; aspect-ratio: 1; border: 1.5px dashed var(--gold-line); display: grid; place-items: center; text-align: center; padding: 14px; font-size: 0.85rem; color: var(--muted); background: var(--paper-2); }
.qr-empty svg { width: 34px; height: 34px; color: var(--gold-ink); margin: 0 auto 6px; display: block; }

/* sections */
.sec { padding-block: clamp(64px, 9vw, 120px); }
.sec-2 { background: var(--paper-2); }
.sec-head { display: grid; gap: 14px; margin-bottom: clamp(32px, 5vw, 56px); max-width: 760px; }
.sec-head.center { text-align: center; margin-inline: auto; justify-items: center; }
.sec-head p { color: var(--muted); }
.about { padding-top: calc(var(--overlap) + clamp(56px, 8vw, 96px)); }
.about-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
.about-text { display: grid; gap: 22px; min-width: 0; }
.about-text .prose { color: var(--ink); }
.photo { margin: 0; background: var(--card); padding: 12px; box-shadow: var(--shadow); }
.photo img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.photo figcaption { font-size: 0.9rem; color: var(--muted); padding: 10px 4px 0; }
.photo-fallback { aspect-ratio: 4 / 5; background: radial-gradient(70% 60% at 50% 30%, rgba(196, 52, 60, 0.6), transparent 70%), var(--red); color: var(--on-red); display: grid; place-items: center; text-align: center; padding: 28px; position: relative; }
.photo-fallback .pf-in { display: grid; gap: 16px; justify-items: center; }
.photo-fallback svg { width: 40px; height: 56px; fill: var(--gold); }
.photo-fallback blockquote { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 3.4vw, 2.6rem); line-height: 1.1; color: var(--gold); }
.photo-fallback cite { font-style: normal; font-weight: 700; letter-spacing: 0.2em; font-size: 0.82rem; text-transform: uppercase; }
.photo-fallback .pf-hint { font-size: 0.85rem; color: var(--on-red-2); border-top: 1px solid var(--on-red-line); padding-top: 12px; }
@media (max-width: 860px) { .about-grid { grid-template-columns: 1fr; } .photo { max-width: 520px; } }

.pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: clamp(48px, 7vw, 88px); border-top: 1px solid var(--line); }
.pillar { padding: 28px 24px 8px 0; display: grid; gap: 12px; align-content: start; min-width: 0; }
.pillar + .pillar { padding-left: 24px; border-left: 1px solid var(--line); }
.pillar svg { width: 40px; height: 40px; color: var(--gold-ink); }
.pillar h3 { font-size: 1.2rem; font-weight: 700; color: var(--red-ink); }
.pillar p { color: var(--muted); font-size: 1.02rem; }
@media (max-width: 980px) {
  .pillars { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pillar:nth-child(3) { padding-left: 0; border-left: 0; }
  .pillar:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 560px) {
  .pillars { grid-template-columns: 1fr; }
  .pillar, .pillar + .pillar { padding: 24px 0 20px; border-left: 0; }
  .pillar + .pillar { border-top: 1px solid var(--line); }
}

/* sunday timeline */
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; position: relative; }
.steps::before { content: ""; position: absolute; top: 31px; left: 32px; right: 32px; height: 1px; background: var(--gold-line); }
.step { display: grid; gap: 14px; align-content: start; position: relative; min-width: 0; }
.step-num { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--red); color: var(--gold); font-family: var(--display); font-weight: 800; font-size: 1.25rem; box-shadow: 0 0 0 6px var(--paper-2), 0 0 0 7px var(--gold-line); position: relative; }
.step h3 { font-size: 1.22rem; font-weight: 700; }
.step p { color: var(--muted); font-size: 1.02rem; }
.step .tag { display: inline-block; font-size: 0.82rem; font-weight: 800; letter-spacing: 0.08em; color: var(--red-ink); border: 1px solid var(--line); padding: 3px 10px; background: var(--card); justify-self: start; }
@media (max-width: 900px) {
  .steps { grid-template-columns: 1fr; gap: 0; }
  .steps::before { top: 32px; bottom: 32px; left: 31px; right: auto; width: 1px; height: auto; }
  .step { grid-template-columns: 64px minmax(0, 1fr); column-gap: 20px; row-gap: 6px; padding-bottom: 28px; }
  .step-num { grid-row: span 3; }
}

/* events */
.events { display: grid; gap: 16px; }
.event { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 24px; align-items: center; background: var(--card); border: 1px solid var(--line); padding: 16px 22px 16px 16px; }
.event-date { background: var(--red); color: var(--on-red); text-align: center; padding: 12px 8px; display: grid; gap: 2px; }
.event-date b { font-family: var(--display); font-size: 2.2rem; line-height: 1; color: var(--gold); }
.event-date span { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }
.event-body { display: grid; gap: 4px; min-width: 0; }
.event-body h3 { font-size: 1.25rem; font-weight: 700; color: var(--red-ink); }
.event-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 0.98rem; }
.event-meta span { display: inline-flex; gap: 6px; align-items: center; }
.event-meta svg { width: 16px; height: 16px; color: var(--gold-ink); }
.event-note { font-size: 1rem; }
.event.past { opacity: 0.6; }
@media (max-width: 680px) {
  .event { grid-template-columns: 84px minmax(0, 1fr); gap: 16px; }
  .event-date b { font-size: 1.8rem; }
}
.empty { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 24px; align-items: center; background: var(--card); padding: clamp(22px, 3vw, 32px); }
.empty svg.ic { width: 46px; height: 46px; color: var(--gold-ink); }
.empty h3 { font-size: 1.25rem; font-weight: 700; color: var(--red-ink); margin-bottom: 4px; }
.empty p { color: var(--muted); }
@media (max-width: 680px) { .empty { grid-template-columns: 1fr; } }

/* gallery */
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.g-item { position: relative; margin: 0; background: var(--card); border: 0; padding: 0; cursor: zoom-in; overflow: hidden; aspect-ratio: 4 / 3; }
.g-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.g-item:hover img { transform: scale(1.04); }
.g-cap { position: absolute; inset: auto 0 0 0; padding: 26px 14px 10px; color: #fff; font-size: 0.95rem; font-weight: 700; text-align: left; background: linear-gradient(transparent, rgba(30, 5, 8, 0.78)); }
.gallery.ph { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-ph { aspect-ratio: 4 / 3; display: grid; place-items: center; text-align: center; gap: 10px; padding: 24px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
.g-ph svg { width: 54px; height: 54px; color: var(--gold-ink); margin-inline: auto; }
.g-ph strong { display: block; color: var(--red-ink); font-family: var(--display); font-size: 1.05rem; }
@media (max-width: 640px) { .g-ph { aspect-ratio: 3 / 4; padding: 12px 6px; font-size: 0.82rem; } .g-ph svg { width: 34px; height: 34px; } .g-ph strong { font-size: 0.85rem; } .gallery.ph { gap: 8px; } }

/* join section */
.join { background:
    radial-gradient(70% 80% at 50% 0%, rgba(196, 52, 60, 0.5), transparent 70%), var(--red-deep);

<script type="application/json" id="cs-state">{"rev": 1, "updated": "2026-10-09", "links": {"whatsapp": "", "instagram": ""}, "hero": {"lead": "Eine multikulturelle katholische Gemeinschaft in Siegen. Nach der Sonntagsmesse in St. Michael bleiben wir zusammen: zum Austausch, für gemeinsame Ausflüge und um uns gegenseitig im Glauben zu stärken."}, "meeting": {"when": "Jeden Sonntag nach der Heiligen Messe", "mass": "", "place": "St. Michael", "street": "Kampenstraße 46", "city": "57072 Siegen", "spot": "Wir treffen uns direkt nach der Messe an der Kirche. Wenn du uns nicht gleich findest, frag kurz in der WhatsApp-Community nach."}, "about": {"title": "Viele Herkünfte. Ein Glaube. Eine Gemeinschaft.", "text": "Come & See ist eine multikulturelle katholische Gemeinschaft in Siegen. Bei uns kommen Menschen aus vielen Ländern, Sprachen und Lebenswegen zusammen.\n\nJeden Sonntag feiern wir die Heilige Messe in St. Michael und bleiben danach noch zusammen. Wir tauschen uns aus, lernen uns kennen, machen gemeinsam Ausflüge und stärken uns gegenseitig im Glauben.\n\nOb du neu in Siegen bist, schon lange hier lebst oder einfach Anschluss suchst: Komm vorbei und sieh selbst.", "image": "", "caption": ""}, "pillars": [{"icon": "talk", "title": "Begegnung", "text": "Nach der Messe bleiben wir zusammen, lernen uns kennen und kommen miteinander ins Gespräch."}, {"icon": "book", "title": "Austausch & Study", "text": "Wir sprechen über Fragen des Glaubens, lesen gemeinsam in der Bibel und lernen voneinander."}, {"icon": "trip", "title": "Ausflüge", "text": "Wir sind gemeinsam unterwegs, entdecken die Region und schaffen Zeit füreinander."}, {"icon": "candle", "title": "Im Glauben stärken", "text": "Wir beten zusammen, teilen, was uns trägt, und ermutigen einander im Alltag als Christen."}], "sunday": [{"title": "Heilige Messe", "text": "Wir feiern gemeinsam die Sonntagsmesse in St. Michael."}, {"title": "Ankommen & Kennenlernen", "text": "Nach der Messe treffen wir uns an der Kirche. Neue Gesichter sind immer willkommen."}, {"title": "Austausch & Glaube", "text": "Wir reden über das, was uns bewegt, teilen Gedanken zum Evangelium und gehen gemeinsam Fragen zum Glauben nach."}, {"title": "Gemeinsam unterwegs", "text": "Ausflüge und Aktionen planen wir zusammen in der WhatsApp-Community."}], "events": [], "gallery": [], "faq": [{"q": "Muss ich katholisch sein, um mitzumachen?", "a": "Nein. Come & See ist eine katholische Gruppe, aber alle, die neugierig sind und den Glauben kennenlernen möchten, sind herzlich willkommen. Komm einfach vorbei und sieh selbst."}, {"q": "Ich spreche wenig Deutsch. Kann ich trotzdem kommen?", "a": "Auf jeden Fall. Bei uns treffen sich Menschen aus vielen Ländern. Wir verständigen uns auf Deutsch und Englisch und helfen uns gegenseitig weiter."}, {"q": "Wann und wo trefft ihr euch?", "a": "Jeden Sonntag nach der Heiligen Messe in St. Michael, Kampenstraße 46 in Siegen. Den genauen Treffpunkt und kurzfristige Änderungen findest du in unserer WhatsApp-Community."}, {"q": "Muss ich mich vorher anmelden?", "a": "Nein. Du kannst nach der Messe einfach dazukommen. Wenn du vorher Fragen hast, schreib uns auf Instagram oder in der WhatsApp-Community."}, {"q": "Kostet die Teilnahme etwas?", "a": "Die Treffen nach der Messe sind kostenlos. Bei Ausflügen können Kosten für Fahrt oder Eintritt anfallen. Das kündigen wir immer vorher an."}, {"q": "Für wen ist Come & See gedacht?", "a": "Für alle, die Gemeinschaft im Glauben suchen: ob du gerade erst nach Siegen gekommen bist, hier studierst, arbeitest oder schon lange hier lebst."}, {"q": "Was passiert in der WhatsApp-Community?", "a": "In der Community gibt es die Gruppe „Allgemein“ für Ankündigungen und Termine und die Gruppe „Austausch & Study“ für Gespräche über den Glauben und gemeinsames Lernen."}, {"q": "Ich war noch nie in einer katholischen Messe. Ist das ein Problem?", "a": "Gar nicht. Setz dich einfach dazu und mach mit, so weit du möchtest. Nach der Messe beantworten wir gern deine Fragen."}], "footer": {"contact": ""}}</script>

    var styles = document.head ? Array.prototype.slice.call(document.head.querySelectorAll('style')) : [];
    var r = styles.filter(function (s) { return /safe-area-inset/.test(s.textContent) && /\[hidden\]/.test(s.textContent); })[0] || styles[0];
    return r ? r.textContent : ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  }
  function buildDocument(s) {
    var SC = '<' + '/script>';
    var json = JSON.stringify(s).replace(/</g, '\\u003c');
    var content = '<title>' + TITLE + '</title>' + FONT_LINKS +
      '<style id="cs-style">' + document.getElementById('cs-style').textContent + '</style>' +
      '<div id="app" class="cs"></div>' +
      '<script type="text/plain" id="cs-asset-michael">' + document.getElementById('cs-asset-michael').textContent + SC +
      '<script type="application/json" id="cs-state">' + json + SC +
      '<script id="cs-main">' + document.getElementById('cs-main').textContent + SC;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetCss() + '</style></head><body>' + content + '</body></html>';
  }
  var ERR = {
    not_writer: 'Du kannst die Website ansehen, aber nicht ändern. Öffne sie mit dem Konto, dem sie gehört.',
    not_granted: 'Speichern ist in dieser Ansicht nicht möglich. Öffne die Website direkt über deinen claude.ai-Link.',
    capability_disabled: 'Speichern ist in dieser Ansicht nicht möglich. Öffne die Website direkt über deinen claude.ai-Link.',
    not_declared: 'Speichern ist für diese Website nicht freigeschaltet.',
    conflict: 'Inzwischen wurde eine neuere Version gespeichert. Die Seite lädt neu; deine Änderungen kannst du danach wiederherstellen.',
    too_large: 'Die Seite ist zu groß geworden. Entferne ein paar Fotos und versuche es noch einmal.',
    rate_limited: 'Gerade wurde oft veröffentlicht. Warte einen Moment und versuche es dann noch einmal.'
  };
  function publish() {
    if (!draft || !dirty) return;
    if (bytesNow() > MAX_BYTES) { updateStatus('error', 'Zu viele Fotos: Entferne einige, bevor du veröffentlichst.'); return; }
    var next = clone(draft);
    next.rev = (state.rev || 0) + 1;
    next.updated = today();
    updateStatus('busy', 'Wird veröffentlicht …');
    var use = window.claude && typeof window.claude.use === 'function' ? window.claude.use('artifact') : Promise.resolve(null);
    Promise.resolve(use).then(function (art) {
      if (!art) { updateStatus('error', ERR.not_granted); return; }
      try { sessionStorage.setItem('cs-pending', JSON.stringify(next)); } catch (e) { /* too big for session storage */ }
      return art.publish(buildDocument(next)).then(function () {
        state = next; draft = clone(next); dirty = false; pending = null;
        updateStatus('ok', 'Veröffentlicht. Die Seite wird neu geladen …');
      }, function (err) {
        var code = err && err.code;
        updateStatus('error', ERR[code] || 'Veröffentlichen hat nicht geklappt. Versuch es gleich noch einmal.');
      });
    }).catch(function () { updateStatus('error', 'Veröffentlichen hat nicht geklappt. Versuch es gleich noch einmal.'); });
  }

  /* ---------- events ---------- */
  var armed = null;
  document.addEventListener('click', function (e) {
    var t = e.target;
    var back = t.closest && t.closest('[data-backdrop]');
    if (back && t === back) { closeLayer('cs-modal'); closeLayer('cs-lb'); return; }
    var go = t.closest('[data-go]');
    if (go) {
      e.preventDefault(); scrollToId(go.getAttribute('data-go'));
      if (menuOpen) {
        menuOpen = false;
        var mm = document.getElementById('mmenu'); if (mm) mm.hidden = true;
        var mb = $('.menu-btn'); if (mb) { mb.setAttribute('aria-expanded', 'false'); mb.innerHTML = icon('menu'); }
      }
      return;
    }
    var opEl = t.closest('[data-op]');
    if (opEl && adminOpen) {
      var op = opEl.getAttribute('data-op'), list = opEl.getAttribute('data-list'), i = parseInt(opEl.getAttribute('data-i'), 10);
      if (op === 'del' || op === 'about-del') {
        var key = op + (list || '') + i;
        if (armed !== key) {
          armed = key; opEl.classList.add('armed'); opEl.textContent = 'Löschen?';
          setTimeout(function () { if (armed === key) { armed = null; renderAdmin(true); } }, 3500);
          return;
        }
        armed = null;
        if (op === 'about-del') { draft.about.image = ''; draft.about.caption = ''; dirty = true; renderAdmin(true); renderPage(); return; }
      }
      if (list) { listOp(list, op, i); return; }
      if (op === 'publish') { publish(); return; }
      if (op === 'discard') { draft = clone(state); dirty = false; statusMsg = null; renderAdmin(); renderPage(); return; }
      if (op === 'restore' && pending) { draft = merge(clone(SKELETON), pending); pending = null; dirty = true; renderAdmin(); renderPage(); return; }
      return;
    }
    var tb = t.closest('[data-tab]');
    if (tb) { tab = tb.getAttribute('data-tab'); renderAdmin(); return; }
    var a = t.closest('[data-action]'); if (!a) return;
    var act = a.getAttribute('data-action');
    if (act === 'join') { e.preventDefault(); openJoin(); }
    else if (act === 'close-modal') closeLayer('cs-modal');
    else if (act === 'menu') {
      menuOpen = !menuOpen;
      var m = document.getElementById('mmenu'); if (m) m.hidden = !menuOpen;
      a.setAttribute('aria-expanded', String(menuOpen)); a.innerHTML = icon(menuOpen ? 'close' : 'menu');
    }
    else if (act === 'lb') openLightbox(parseInt(a.getAttribute('data-i'), 10));
    else if (act === 'lb-prev') openLightbox(lbIndex - 1);
    else if (act === 'lb-next') openLightbox(lbIndex + 1);
    else if (act === 'close-lb') closeLayer('cs-lb');
    else if (act === 'copy-address') copyText(addressText(cur().meeting), 'Adresse kopiert');
    else if (act === 'admin') openAdmin();
    else if (act === 'admin-close') closeAdmin();
  });
  document.addEventListener('input', function (e) {
    var el = e.target, path = el.getAttribute && el.getAttribute('data-path');
    if (!path || !draft) return;
    setPath(draft, path, el.value);
    if (path.indexOf('links.') === 0) {
      var qp = document.getElementById('qr-prev'); if (qp) qp.innerHTML = qrTile('wa', draft) + qrTile('ig', draft);
      var lw = document.getElementById('link-warn'); if (lw) lw.innerHTML = linkWarn();
    }
    changed();
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-upload') && draft) handleUpload(el);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (layers['cs-lb'] && !layers['cs-lb'].hidden) closeLayer('cs-lb');
      else if (layers['cs-modal'] && !layers['cs-modal'].hidden) closeLayer('cs-modal');
      else if (adminOpen) closeAdmin();
    } else if (layers['cs-lb'] && !layers['cs-lb'].hidden) {
      if (e.key === 'ArrowLeft') openLightbox(lbIndex - 1);
      if (e.key === 'ArrowRight') openLightbox(lbIndex + 1);
    }
  });

  /* ---------- start ---------- */
  renderPage();
  (function initEditing() {
    var wantAdmin = location.hash === '#admin';
    var hasClaude = window.claude && typeof window.claude.use === 'function';
    var p = hasClaude ? Promise.resolve(window.claude.use('user')).then(function (u) { return u ? u.canEdit() : false; }).catch(function () { return false; }) : Promise.resolve(false);
    p.then(function (ok) {
      if (ok || wantAdmin) {
        canEdit = true; renderPage();
        if (wantAdmin || pending) openAdmin();
      }
    });
  })();
})();
</script>

</body></html>
